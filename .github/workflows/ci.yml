name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: trip-service
            test: TripStatusTest
          - service: payment-service
            test: FareCalculatorTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '${{ matrix.service }}/pom.xml'
      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: mvn -B test -Dtest=${{ matrix.test }}
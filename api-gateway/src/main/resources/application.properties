spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webflux.routes[1].id=trip-service
spring.cloud.gateway.server.webflux.routes[1].uri=${TRIP_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/trips/**

spring.cloud.gateway.server.webflux.routes[2].id=location-service
spring.cloud.gateway.server.webflux.routes[2].uri=${LOCATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/drivers/**
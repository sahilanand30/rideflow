services:
  postgres:
    image: postgres:16
    container_name: rideflow-postgres
    environment:
      POSTGRES_USER: rideflow
      POSTGRES_PASSWORD: rideflow
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U rideflow -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: rideflow-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.0
    container_name: rideflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  user-service:
    build: ./user-service
    container_name: rideflow-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: rideflow
      SPRING_DATASOURCE_PASSWORD: rideflow
    depends_on:
      postgres:
        condition: service_healthy

  trip-service:
    build: ./trip-service
    container_name: rideflow-trip-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trip_db
      SPRING_DATASOURCE_USERNAME: rideflow
      SPRING_DATASOURCE_PASSWORD: rideflow
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_started

  location-service:
    build: ./location-service
    container_name: rideflow-location-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started

  matching-service:
    build: ./matching-service
    container_name: rideflow-matching-service
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LOCATION_SERVICE_URL: http://location-service:8084
    depends_on:
      kafka:
        condition: service_started
      location-service:
        condition: service_started

  payment-service:
    build: ./payment-service
    container_name: rideflow-payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: rideflow
      SPRING_DATASOURCE_PASSWORD: rideflow
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    build: ./notification-service
    container_name: rideflow-notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: rideflow-api-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      TRIP_SERVICE_URL: http://trip-service:8082
      LOCATION_SERVICE_URL: http://location-service:8084
    depends_on:
      user-service:
        condition: service_started
      trip-service:
        condition: service_started
      location-service:
        condition: service_started

volumes:
  postgres-data:
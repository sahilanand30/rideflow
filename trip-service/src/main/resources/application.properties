spring.application.name=trip-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/trip_db
spring.datasource.username=rideflow
spring.datasource.password=rideflow

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

user-service.url=http://localhost:8081

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all

spring.kafka.consumer.group-id=trip-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.rideflow.trip_service.event.RideMatchedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rideflow.trip_service.event